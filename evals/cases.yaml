      expect:
        contains_all: ["14 de maio", "3200"]

- id: horario_sabado
  descricao: Horário de sábado (do contexto).
  turns:
    - user: "Vocês abrem sábado? Até que horas?"
      expect:
        contains_all: ["13"]

- id: conversa_longa_mantem_contexto
  descricao: Mantém o produto citado ao longo de vários turnos.
  turns:
    - user: "Quanto custa o Takamine GD20?"
      expect:
        contains_all: ["2.199,00"]
    - user: "Vocês abrem sábado?"
      expect: {}
    - user: "E vendem palheta?"
      expect: {}
    - user: "E aquele violão que perguntei, dá pra parcelar em quantas vezes?"
      expect:
        tools_all: [simular_pagamento]
        args:
          - tool: simular_pagamento
            match: {itens: [{produto_id: 95}]}
        contains_any: ["12x", "12 vezes", "doze"]

- id: holdout_pix_quantidade
  descricao: PIX de item em promoção com quantidade 2 (sem desconto PIX).
  holdout: true
  turns:
    - user: "Quero 2 ukuleles Ohana CK-20. Quanto fica no PIX?"
      expect:
        tools_all: [simular_pagamento]
        args:
          - tool: simular_pagamento
            match: {itens: [{produto_id: 121, quantidade: 2}]}
        contains_all: ["878,40"]
        not_contains: ["834,48"]

