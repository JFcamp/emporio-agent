    - user: "Vocês entregam em Dourados? Demora quanto?"
      expect:
        tools_any: [buscar_politica]
        contains_any: ["pac", "sedex", "jadlog"]

- id: endereco
  descricao: Endereço da loja (do contexto).
  turns:
